<!doctype html>
<html lang="ar" dir="rtl" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#2d442c" />
    <meta name="msapplication-TileColor" content="#2d442c" />

    <!-- Primary Meta Tags -->
    <title>__PAGE_TITLE__</title>
    <meta name="title" content="__PAGE_TITLE__" />
    <meta
      name="description"
      content="__META_DESCRIPTION__"
    />
    <meta
      name="keywords"
      content="__KEYWORDS__"
    />
    <meta name="author" content="__AUTHOR__" />

    <!-- Open Graph / WhatsApp / Facebook / Telegram -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="__SITE_NAME__" />
    <meta property="og:title" content="__OG_TITLE__" />
    <meta
      property="og:description"
      content="__OG_DESCRIPTION__"
    />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.webp" />
    <meta
      property="og:image:secure_url"
      content="%VITE_SITE_URL%/og-image.webp"
    />
    <meta property="og:image:type" content="image/webp" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="__OG_IMAGE_ALT__"
    />
    <meta property="og:locale" content="ar_EG" />
    <meta property="og:locale:alternate" content="en_US" />

    <!-- Twitter / X Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="__OG_TITLE__" />
    <meta
      name="twitter:description"
      content="__META_DESCRIPTION__"
    />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og-image.webp" />
    <meta name="twitter:image:alt" content="__OG_TITLE__" />

    <!-- Apple Mobile Web App -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="__AUTHOR__" />

    <!-- Critical Hero Image Preload for 95+ LCP -->
    <link
      rel="preload"
      as="image"
      href="__HERO_PHOTO__"
      type="image/webp"
      fetchpriority="high"
    />

    <!-- Google Fonts Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Optimized Non-Blocking Fonts Loading -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@400;700&family=Cairo:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@400;500;600&family=Tajawal:wght@400;500;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@400;700&family=Cairo:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@400;500;600&family=Tajawal:wght@400;500;700&display=swap"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@400;700&family=Cairo:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@400;500;600&family=Tajawal:wght@400;500;700&display=swap"
      />
    </noscript>
  </head>
  <body
    class="bg-[#f8f7f3] text-[#2d442c] antialiased overflow-x-hidden min-h-screen"
  >
    <div id="root" class="w-full min-h-screen"></div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
