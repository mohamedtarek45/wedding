<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Deep Luxury Olive Emerald) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#364f33" />
      <stop offset="50%" stop-color="#2d442c" />
      <stop offset="100%" stop-color="#192819" />
    </linearGradient>

    <!-- Outer Gold Border Gradient -->
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF0CD" />
      <stop offset="25%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#AA771C" />
      <stop offset="75%" stop-color="#F3E5AB" />
      <stop offset="100%" stop-color="#8A5A00" />
    </linearGradient>

    <!-- Ring 1 Gold Gradient -->
    <linearGradient id="ringGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3D1" />
      <stop offset="30%" stop-color="#E5C158" />
      <stop offset="60%" stop-color="#C59B27" />
      <stop offset="90%" stop-color="#8F6810" />
      <stop offset="100%" stop-color="#FDF0CD" />
    </linearGradient>

    <!-- Ring 2 Gold Gradient -->
    <linearGradient id="ringGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDF0CD" />
      <stop offset="25%" stop-color="#D4AF37" />
      <stop offset="55%" stop-color="#B8860B" />
      <stop offset="80%" stop-color="#E5C158" />
      <stop offset="100%" stop-color="#7C5200" />
    </linearGradient>

    <!-- Diamond Gradients -->
    <linearGradient id="diamondBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#E0F2FE" />
      <stop offset="100%" stop-color="#BAE6FD" />
    </linearGradient>

    <linearGradient id="diamondFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#7DD3FC" stop-opacity="0.4" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="ringShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#071007" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Circular Base Badge -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" filter="url(#shadow)" />

  <!-- Outer Double Gold Rim -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#goldRim)" stroke-width="8" opacity="0.9" />
  <circle cx="256" cy="256" r="222" fill="none" stroke="url(#goldRim)" stroke-width="2.5" opacity="0.6" />

  <!-- Subtle Inner Vignette Ring -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="#0f1a0e" stroke-width="4" opacity="0.4" />

  <!-- Golden Ring 1 (Left / Bride Ring with Diamond) -->
  <g filter="url(#ringShadow)">
    <!-- Outer Ring Base -->
    <circle cx="204" cy="280" r="92" fill="none" stroke="url(#ringGrad1)" stroke-width="26" />
    <!-- Inner Rim Highlight -->
    <circle cx="204" cy="280" r="105" fill="none" stroke="#FFF7D6" stroke-width="2" opacity="0.75" />
    <circle cx="204" cy="280" r="79" fill="none" stroke="#7A5200" stroke-width="2" opacity="0.6" />
  </g>

  <!-- Golden Ring 2 (Right / Groom Ring) -->
  <g filter="url(#ringShadow)">
    <!-- Outer Ring Base -->
    <circle cx="308" cy="280" r="92" fill="none" stroke="url(#ringGrad2)" stroke-width="26" />
    <!-- Inner Rim Highlight -->
    <circle cx="308" cy="280" r="105" fill="none" stroke="#FFF7D6" stroke-width="2" opacity="0.75" />
    <circle cx="308" cy="280" r="79" fill="none" stroke="#7A5200" stroke-width="2" opacity="0.6" />
  </g>

  <!-- Ring Interlocking Effect (Draw foreground segment of left ring over right ring) -->
  <g filter="url(#ringShadow)">
    <path d="M 235 200 A 92 92 0 0 1 296 280" fill="none" stroke="url(#ringGrad1)" stroke-width="26" stroke-linecap="round" />
    <path d="M 235 200 A 92 92 0 0 1 296 280" fill="none" stroke="#FFF7D6" stroke-width="2" opacity="0.6" />
  </g>

  <!-- Diamond Setting Prongs on Left Ring -->
  <!-- Diamond Setting Crown Base -->
  <path d="M 186 188 L 222 188 L 214 200 L 194 200 Z" fill="url(#goldRim)" filter="url(#ringShadow)" />

  <!-- Brilliant Cut Diamond -->
  <g filter="url(#ringShadow)">
    <!-- Table / Crown of Diamond -->
    <!-- Diamond Outline -->
    <polygon points="204,136 172,168 204,204 236,168" fill="url(#diamondBody)" stroke="#E0F2FE" stroke-width="1.5" />
    <!-- Top Crown Triangle -->
    <polygon points="204,136 188,168 204,176 220,168" fill="#FFFFFF" opacity="0.95" />
    <!-- Left Facet -->
    <polygon points="172,168 188,168 204,176 204,204" fill="url(#diamondFacet)" />
    <!-- Right Facet -->
    <polygon points="236,168 220,168 204,176 204,204" fill="#93C5FD" opacity="0.8" />
    <!-- Central Table Facet -->
    <polygon points="204,136 188,168 204,204 220,168" fill="#F0F9FF" opacity="0.75" stroke="#FFFFFF" stroke-width="1" />
  </g>

  <!-- Diamond Brilliance Sparkles (✨) -->
  <!-- Main Top Star Sparkle -->
  <g filter="url(#glow)">
    <path d="M 204 116 Q 204 136 184 136 Q 204 136 204 156 Q 204 136 224 136 Q 204 136 204 116 Z" fill="#FFFFFF" />
    <circle cx="204" cy="136" r="3" fill="#FFFBEB" />
  </g>

  <!-- Accent Mini Sparkles -->
  <g filter="url(#glow)" opacity="0.9">
    <path d="M 335 210 Q 335 220 325 220 Q 335 220 335 230 Q 335 220 345 220 Q 335 220 335 210 Z" fill="#FDE68A" />
    <path d="M 148 310 Q 148 318 140 318 Q 148 318 148 326 Q 148 318 156 318 Q 148 318 148 310 Z" fill="#FDE68A" />
  </g>

  <!-- Tiny Golden Heart / Monogram Accent at Bottom Center -->
  <g opacity="0.85">
    <path d="M 256 395 C 256 395 240 380 232 368 C 224 356 228 344 240 344 C 248 344 254 350 256 354 C 258 350 264 344 272 344 C 284 344 288 356 280 368 C 272 380 256 395 256 395 Z" fill="url(#goldRim)" />
  </g>
</svg>
